info:
  name: customer notification
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/customer/notifications"
  auth:
    type: bearer
    token: "{{customer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
