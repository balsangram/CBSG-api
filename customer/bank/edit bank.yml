info:
  name: edit bank
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{base_url}}/customer/bank"
  body:
    type: json
    data: |-
      {
        "bankName":"SBI",
        "accountNumber":"888888888",
        "ifscCode":"HDFC0000124"
