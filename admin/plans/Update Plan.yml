info:
  name: Update Plan
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/admin/plans/{{planId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "monthlyInterest": 2.0,
        "status": "DRAFT"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
