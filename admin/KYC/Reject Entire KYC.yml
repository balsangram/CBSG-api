info:
  name: Reject Entire KYC
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/admin/kyc/{{customerId}}/reject"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "reason": "Documents do not match the registered details"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
